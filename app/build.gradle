plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'vn.travelvn.app'
    compileSdk 35

    defaultConfig {
        applicationId 'vn.travelvn.app'
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName '1.2'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
