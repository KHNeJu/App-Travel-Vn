plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'vn.travelvn.app'
    compileSdk 35
    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'vn.travelvn.app'
        minSdk 24
        targetSdk 35
        versionCode 8
        versionName '1.6'
        resValue 'string', 'travel_firebase_key', providers.gradleProperty('travelFirebaseKey').orElse(providers.environmentVariable('FIREBASE_WEB_API_KEY')).getOrElse('')
        resValue 'string', 'travel_backend_url', providers.gradleProperty('travelBackendUrl').orElse(providers.environmentVariable('TRAVEL_BACKEND_URL')).getOrElse('')
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
