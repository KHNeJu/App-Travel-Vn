<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src data: https://tile.openstreetmap.org; connect-src https://routing.openstreetmap.de">
<link rel="stylesheet" href="leaflet.css">
<style>
  html, body, #map { height: 100%; margin: 0; font-family: system-ui, sans-serif; }
  #map { background: #e8f0e9; }
  .pin { box-sizing: border-box; border: 2px solid #fff; background: #193a77; color: white; border-radius: 50%;
         display: grid; place-items: center; font-weight: bold; font-size: 13px; box-shadow: 0 2px 5px #13284c50; }
  #bar { position: absolute; z-index: 1000; left: 12px; bottom: 25px; right: 12px; display: flex; align-items: flex-start; gap: 8px; pointer-events: none; }
  #bar span, #bar button { border: 0; border-radius: 10px; font-size: 12px; padding: 8px 10px; background: white; color: #15315d; }
  #bar button { background: #193a77; color: white; pointer-events: auto; flex-shrink: 0; }
  #bar button:disabled { opacity: .65; }
  #note:empty { display: none; }
</style>
<main id="map" aria-label="Bản đồ điểm dừng"></main>
<aside id="bar"><button id="calculate" hidden>Tính đường giữa ghim</button><span id="note" role="status"></span></aside>
<script src="leaflet.js"></script>
<script>
  const map = L.map('map', { maxZoom: 19 }).setView([16.0, 106], 5);
  map.attributionControl.setPrefix(false);
  const tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · <a href="https://www.openstreetmap.org/fixthemap">Sửa bản đồ</a>'
  }).addTo(map);
  const markers = L.layerGroup().addTo(map);
  const note = document.querySelector('#note');
  const calculate = document.querySelector('#calculate');
  const results = new Map();
  let stops = [];
  let line = null;
  let request = 0;
  let lastCall = 0;
  let pending = false;

  window.setRoute = ({ center, points }) => {
    request++;
    markers.clearLayers();
    if (line) { map.removeLayer(line); line = null; }
    stops = points;
    const latlngs = points.map(stop => [stop.lat, stop.lon]);
    points.forEach((stop, index) => {
      const pin = L.divIcon({ className: 'pin', html: String(stop.number), iconSize: [30, 30], iconAnchor: [15, 15] });
      const text = document.createElement('span');
      text.textContent = stop.name;
      L.marker(latlngs[index], { icon: pin, title: stop.name, alt: stop.name }).bindPopup(text).addTo(markers);
    });
    if (latlngs.length > 1) {
      line = L.polyline(latlngs, { color: '#346ee4', dashArray: '7 8', weight: 4 }).addTo(map);
      map.fitBounds(L.latLngBounds(latlngs), { padding: [36, 42], maxZoom: 15 });
    } else map.setView(latlngs[0] || center || [16.0, 106], latlngs.length ? 15 : center ? 12 : 5);
    calculate.hidden = points.length < 2;
    calculate.disabled = pending;
    note.textContent = points.length === 0 ? 'Ngày này chưa có ghim bản đồ.' : points.length > 1 ? 'Nét đứt thể hiện thứ tự ghé.' : '';
  };

  function drawResult(route) {
    if (line) map.removeLayer(line);
    const points = route.geometry.coordinates.map(([lon, lat]) => [lat, lon]);
    line = L.polyline(points, { color: '#2464e7', weight: 5 }).addTo(map);
    const km = new Intl.NumberFormat('vi-VN', { maximumFractionDigits: 1 }).format(route.distance / 1000);
    note.textContent = km + ' km · khoảng ' + Math.round(route.duration / 60) + ' phút · OSRM';
  }

  calculate.addEventListener('click', async () => {
    if (pending || Date.now() - lastCall < 1100 || stops.length < 2) return;
    const key = stops.map(stop => stop.lon + ',' + stop.lat).join(';');
    if (results.has(key)) { drawResult(results.get(key)); return; }
    const selected = request;
    lastCall = Date.now();
    pending = true;
    calculate.disabled = true;
    note.textContent = 'Đang tính đường đi…';
    const timeout = new AbortController();
    const timer = setTimeout(() => timeout.abort(), 8500);
    try {
      const response = await fetch('https://routing.openstreetmap.de/routed-car/route/v1/driving/' + key
        + '?overview=full&geometries=geojson&steps=false', { signal: timeout.signal, redirect: 'error' });
      if (!response.ok) throw new Error('Route unavailable');
      const json = await response.json();
      const route = json.routes && json.routes[0];
      if (json.code !== 'Ok' || !route) throw new Error('Route unavailable');
      results.set(key, route);
      if (request === selected) drawResult(route);
    } catch (error) {
      if (request === selected) note.textContent = 'Chưa tính được đường. Bạn có thể mở Google Maps.';
    } finally {
      clearTimeout(timer);
      pending = false;
      calculate.disabled = false;
    }
  });
  tiles.once('tileerror', () => { note.textContent = 'Bản đồ nền cần kết nối mạng.'; });
</script>
</html>
